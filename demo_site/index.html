<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo Shop</title>
<style>body{font-family:Arial;margin:0;background:#f4f4f4}header{background:#223355;color:#fff;padding:14px 24px;font-size:22px}
main{padding:32px 24px}.row{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:20px}
button{font-size:18px;padding:10px 16px;border:0;border-radius:6px;background:#2a7fff;color:#fff;cursor:pointer}
#edit-icon{background:none;border:2px solid #444;color:#444;border-radius:50%;width:38px;height:38px;padding:0;font-size:18px}
input{font-size:18px;padding:8px;width:340px}#banner{display:none;background:#2e9e5b;color:#fff;padding:14px 24px;position:fixed;bottom:0;left:0;right:0;font-size:20px}</style></head>
<body><header>Checkout</header><main>
<div class="row" id="view"><span id="addr-text">Shipping address: Rua A, 100</span><button id="edit-icon" aria-label="edit">&#9998;</button></div>
<div class="row" id="editor" style="display:none"><input id="addr" value="Rua A, 100"><button id="save">Save</button></div>
<div class="row"><button id="pay">Pay now</button></div></main><div id="banner">Address updated</div>
<script>
edit=document.getElementById('edit-icon');edit.onclick=()=>{view.style.display='none';editor.style.display='flex'};
document.getElementById('save').onclick=()=>{document.getElementById('addr-text').textContent='Shipping address: '+addr.value;editor.style.display='none';view.style.display='flex';banner.style.display='block'};
</script></body></html>
